"on":
    push:
        branches:
            - main
name: Deploy to browser-app
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: browser-app
                PORTER_CLUSTER: "6217"
                PORTER_DEPLOYMENT_TARGET_ID: ce40ca02-2381-4e08-9e84-5f74853ec8ec
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "20260"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_20260_28441 }}
