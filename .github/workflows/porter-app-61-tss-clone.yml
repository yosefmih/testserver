"on":
    push:
        branches:
            - main
name: Deploy to tss-clone
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: tss-clone
                PORTER_CLUSTER: "61"
                PORTER_DEPLOYMENT_TARGET_ID: 7d6f519f-9906-4d2a-a170-0829dbb4114f
                PORTER_HOST: https://yosefdev2.withporter.run
                PORTER_PROJECT: "5"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_5_26 }}
