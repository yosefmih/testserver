"on":
    push:
        branches:
            - main
name: Deploy to paddle
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: paddle
                PORTER_CLUSTER: "1"
                PORTER_DEPLOYMENT_TARGET_ID: cb69b240-d474-4e3d-99af-32e002f32af5
                PORTER_HOST: https://yosefdev2.withporter.run
                PORTER_PROJECT: "5"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_5_6 }}
