"on":
    push:
        branches:
            - main
name: Deploy to paddle-too
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: paddle-too
                PORTER_CLUSTER: "9"
                PORTER_DEPLOYMENT_TARGET_ID: 8f27c05f-849f-4577-8bba-6c536689e905
                PORTER_HOST: https://yosefdev2.withporter.run
                PORTER_PROJECT: "5"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_5_8 }}
