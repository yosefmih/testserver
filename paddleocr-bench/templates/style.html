{{define "style"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 24px; color: #1f2328; background: #f6f8fa; }
  a { color: #0969da; text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; margin-bottom: 16px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #d8dee4; font-variant-numeric: tabular-nums; }
  th { font-weight: 600; color: #57606a; font-size: 12px; text-transform: uppercase; }
  .status { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .status.queued { background: #eaeef2; color: #57606a; }
  .status.running { background: #ddf4ff; color: #0969da; }
  .status.done { background: #dafbe1; color: #1a7f37; }
  .status.failed { background: #ffebe9; color: #cf222e; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .metric { background: #f6f8fa; border-radius: 6px; padding: 10px 12px; }
  .metric .label { font-size: 11px; text-transform: uppercase; color: #57606a; }
  .metric .value { font-size: 20px; font-weight: 600; }
  .metric .value.big { color: #0969da; }
  form label { display: block; margin: 8px 0 4px; font-weight: 600; }
  form input[type=number] { width: 80px; }
  form .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; }
  button { background: #1f883d; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
  .error { background: #ffebe9; border: 1px solid #ff8182; color: #cf222e; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; }
  .muted { color: #57606a; }
  .err { color: #cf222e; font-size: 12px; max-width: 480px; overflow-wrap: anywhere; }
  .markdown { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 24px; max-width: 900px; }
  .markdown img { max-width: 100%; }
  .markdown table { width: auto; border: 1px solid #d0d7de; margin: 12px 0; }
  .markdown td, .markdown th { border: 1px solid #d0d7de; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f6f8fa; padding: 12px; border-radius: 6px; }
  nav { margin-bottom: 16px; }
</style>
{{end}}
