# Use an image you built from this repository's Dockerfile.
image: example.invalid/paddleocr/app:latest
serviceAccount:
  create: true
  name: paddleocr-app
  annotations: {} # Set eks.amazonaws.com/role-arn for IRSA, or configure EKS Pod Identity.
env:
  S3_BUCKET: replace-with-your-bucket
  AWS_REGION: us-east-1
  S3_PREFIX: paddleocr-app
  PADDLEOCR_URL: http://paddleocr-hps.paddleocr.svc.cluster.local:8080
  DEFAULT_CHUNK_PAGES: "50"
  DEFAULT_CONCURRENCY: "2"
