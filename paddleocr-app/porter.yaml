version: v2
name: paddle
services:
- name: web
  run: ""
  type: web
  instances: 1
  cpuCores: 2
  ramMegabytes: 2048
  terminationGracePeriodSeconds: 30
  port: 8080
  domains:
  - name: web-6-cb69b240-gwes8ykn.withporter.run
  connections:
  - type: awsRole
    role: arn:aws:iam::992382605253:role/porter-s3-8556ae3b
build:
  context: ./paddleocr-app
  method: docker
  dockerfile: ./paddleocr-app/Dockerfile
env:
- key: PADDLEOCR_URL
  value: http://paddleocr-hps.paddleocr.svc.cluster.local:8080
- key: S3_BUCKET
  value: porter-5-paddleocr-pdfs-5397ce8b
- key: S3_PREFIX
  value: paddleocr-app
- key: AWS_REGION
  value: us-east-1
- key: DEFAULT_CHUNK_PAGES
  value: "50"
- key: DEFAULT_CONCURRENCY
  value: "2"
- key: RESTRUCTURE_PAGES
  value: "true"

