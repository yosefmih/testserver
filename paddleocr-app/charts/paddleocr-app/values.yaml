replicas: 1
image: example.invalid/paddleocr/app:latest
imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
  annotations: {}
env:
  S3_BUCKET: ""
  AWS_REGION: us-east-1
  S3_PREFIX: paddleocr-app
  PADDLEOCR_URL: http://paddleocr-hps.paddleocr.svc.cluster.local:8080
  DEFAULT_CHUNK_PAGES: "50"
  DEFAULT_CONCURRENCY: "2"
  JOB_CONCURRENCY: "4"
  DRAIN_TIMEOUT_SECONDS: "540"
resources:
  requests: {cpu: "1", memory: 2Gi}
  limits: {memory: 4Gi}
terminationGracePeriodSeconds: 600
