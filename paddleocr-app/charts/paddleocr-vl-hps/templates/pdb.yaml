{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "paddleocr-vl-hps.name" . }}
  labels:
    {{- include "paddleocr-vl-hps.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "paddleocr-vl-hps.selectorLabels" . | nindent 6 }}
{{- end }}
